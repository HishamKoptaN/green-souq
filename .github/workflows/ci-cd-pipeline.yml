name: CI/CD Pipeline #12321122

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_pr:
    if: github.event_name == 'push' && github.ref_name != 'prod' && github.ref_name != 'dev'
    uses: HishamKoptaN/ci_cd_pipeline/.github/workflows/auto-pr.yml@prod
    secrets: inherit

  prod_pipeline:
    if: github.ref_name == 'prod'
    uses: HishamKoptaN/ci_cd_pipeline/.github/workflows/20-shorebird-layer.yml@prod
    secrets: inherit

  dev_pipeline:
    if: github.ref_name == 'dev'
    uses: HishamKoptaN/ci_cd_pipeline/.github/workflows/50-distribution-layer.yml@prod
    secrets: inherit
