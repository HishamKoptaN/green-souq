name: Deploy

on:
  push:
    branches:
      - prod
      
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  web-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: cp web/firebase-messaging-sw-prod.js web/firebase-messaging-sw.js
      - run: |
              COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')      
              flutter build web \
              --base-href "/" \
              --dart-define=ENV=prod \
              --dart-define=COMMIT_MESSAGE="$COMMIT_MSG" \
              --release \
              --pwa-strategy=none
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOSTING_HOST }}
          username: ${{ vars.HOSTING_USER }}
          password: ${{ secrets.HOSTING_PASSWORD }}
          port: ${{ vars.HOSTING_PORT }}
          source: "build/web/*"
          target: "domains/springgreen-turtle-355093.hostingersite.com/public_html"
          