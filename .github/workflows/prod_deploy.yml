name: Deploy

on:
  push:
    branches:
      - prod
      
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  web-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          architecture: x64
          cache: false
          pub-cache-path: default
          dry-run: false
      - run: flutter upgrade
      - run: flutter pub get
      - run: cp web/firebase-messaging-sw-prod.js web/firebase-messaging-sw.js
      - run: |
              COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')      
              flutter build web \
              --base-href "/" \
              --dart-define=ENV=prod \
              --dart-define=COMMIT_MESSAGE="$COMMIT_MSG" \
              --release \
              --pwa-strategy=none
      - uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: code1632001@
          REMOTE_HOST: 82.197.83.233
          REMOTE_USER: u943485201
          REMOTE_PORT: 65002
          SOURCE: "build/web/"
          TARGET: /
          ARGS: "-rlgoDzvc --delete"