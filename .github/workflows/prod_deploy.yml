name: Deploy

on:
  push:
    branches:
      - prod
      
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  web-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true
      - run: flutter upgrade
      - run: flutter pub get
      - run: cp web/firebase-messaging-sw-prod.js web/firebase-messaging-sw.js
      - run: |
              COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')      
              flutter build web \
              --base-href "/" \
              --dart-define=ENV=prod \
              --dart-define=COMMIT_MESSAGE="$COMMIT_MSG" \
              --release \
              --pwa-strategy=none
      - uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTING_PASSWORD }}
          REMOTE_HOST: ${{ vars.HOSTING_HOST }}
          REMOTE_USER: ${{ vars.HOSTING_USER }}
          REMOTE_PORT: ${{ vars.HOSTING_PORT }}
          SOURCE: "build/web/"
          TARGET: ${{ vars.TARGET_DIR }}
          ARGS: "-rlgoDzvc --delete"