name: CI/CD Pipeline 123

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب مشروعك الحالي
      - name: Checkout Current App
        uses: actions/checkout@v4

      # 2. سحب مستودع الأدوات المركزي
      - name: Checkout DevOps Core
        uses: actions/checkout@v4
        with:
          repository: HishamKoptaN/flutter-devops-core
          ref: prod
          token: ${{ secrets.GITHUB_TOKEN }}
          path: temp-devops-core

      # 3. نسخ مجلد .github محلياً في نفس البيئة
      - name: Sync DevOps Files Locally
        run: |
          mkdir -p .github/actions .github/workflows
          cp -r temp-devops-core/.github/actions/* .github/actions/ 2>/dev/null || true
          cp -r temp-devops-core/.github/workflows/* .github/workflows/ 2>/dev/null || true

      # 4. (ملاحظة هامة): بما أن الـ Reusable Workflows (uses:) يتم تقييمها وقراءتها من قبل جيت هب 
      # قبل بدء تشغيل الخطوات (Steps)، فإن استدعاء ملف تم نسخه للتو قد يعطي خطأ "workflow was not found".
      # لذلك، الأفضل هو تشغيل الخطوات أو الـ Actions الموجودة بداخل ملف 00-main.yml مباشرة 
      # أو استدعاء الأكشن الأساسي هكذا: