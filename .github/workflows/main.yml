name: CI/CD Pipeline #13

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HishamKoptaN/flutter-devops-core
          ref: prod
          token: ${{ secrets.GITHUB_TOKEN }} 
          path: core
      - run: |
          mkdir -p .github/actions .github/workflows
          cp -r core/.github/actions/* .github/actions/ 2>/dev/null || true
          cp -r core/.github/workflows/* .github/workflows/ 2>/dev/null || true
      - uses: ./.github/workflows/00-main.yml