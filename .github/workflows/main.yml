name: CI/CD Pipeline #11222
on:
    push:
        branches: [ prod ]
    workflow_dispatch:
permissions:
    contents: write
jobs:
    # workflows:
    #     uses: HishamKoptaN/flutter-devops-core/.github/workflows/00-main.yml@prod
    #     secrets: inherit
    deploy:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: HishamKoptaN/flutter-devops-core@v5
          with:
             shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}
             github-token: ${{ secrets.GITHUB_TOKEN }}
             
          