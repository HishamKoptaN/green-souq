name: CI/CD Pipeline #1232322
on:
    push:
        branches: [ prods ]
    workflow_dispatch:
permissions:
    contents: write
jobs:
    deploy:
      runs-on: ubuntu-latest
      environment: ${{ github.ref_name }}
      env: 
        SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      steps:
        - uses: actions/checkout@v4
        - uses: HishamKoptaN/flutter-devops-core@v1
        - run: |
            sudo apt-get install -y sshpass
            sshpass -p "${{ secrets.HOSTING_PASSWORD }}" ssh -p ${{ vars.HOSTING_PORT }} -o StrictHostKeyChecking=no ${{ vars.HOSTING_USER }}@${{ vars.HOSTING_HOST }} "mkdir -p domains/springgreen-turtle-355093.hostingersite.com/public_html/downloads"
            sshpass -p "${{ secrets.HOSTING_PASSWORD }}" scp -P ${{ vars.HOSTING_PORT }} -o StrictHostKeyChecking=no build/app/outputs/flutter-apk/app-prod-release.apk ${{ vars.HOSTING_USER }}@${{ vars.HOSTING_HOST }}:domains/springgreen-turtle-355093.hostingersite.com/public_html/downloads/