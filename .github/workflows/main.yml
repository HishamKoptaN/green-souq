name: CI/CD Pipeline #12322
on:
    push:
        branches: [ prod ]
    workflow_dispatch:
permissions:
    contents: write
jobs:
    deploy:
      runs-on: ubuntu-latest
      environment: ${{ github.ref_name }}
      env: 
        SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      steps:
        - uses: actions/checkout@v4
        - uses: HishamKoptaN/flutter-devops-core@v1
        - uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ vars.HOSTING_HOST }}
            username: ${{ vars.HOSTING_USER }}
            password: ${{ secrets.HOSTING_PASSWORD }}
            port: ${{ vars.HOSTING_PORT }}
            source: "build/app/outputs/flutter-apk/app-prod-release.apk"
            target: "domains/springgreen-turtle-355093.hostingersite.com/public_html/downloads"
            strip_components: 4
       