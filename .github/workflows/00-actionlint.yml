name: Lint GitHub Actions
on:
  pull_request: {}
  push:
    branches: [dev, prod]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: raven-actions/actionlint@v2
